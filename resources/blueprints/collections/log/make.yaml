title: Make
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: kind
            field:
              type: select
              display: Kind
              options:
                lego: LEGO
                3d-print: '3D print'
                art: Art
                baking: Baking
                puzzle: Puzzle
              validate:
                - required
          -
            handle: photos
            field:
              type: assets
              display: Photos
              container: assets
              folder: makes
              instructions: 'The first photo leads. Give every photo alt text.'
              min_files: 1
          -
            handle: models
            field:
              type: assets
              display: '3D Models'
              container: assets
              folder: makes
              instructions: 'Optional. .stl files people can spin around on the page.'
              if:
                kind: 'equals 3d-print'
          -
            handle: note
            field:
              type: text
              display: Note
              instructions: 'Optional handwritten note, one short line in your voice.'
          -
            handle: content
            field:
              type: markdown
              display: Caption
              instructions: 'One or two sentences: what it is, and what went wrong the first time.'
              localizable: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Optional. A sentence for search results and link previews; without one, the first sentence of the caption is used.'
              localizable: true
