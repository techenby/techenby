title: Home
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: heading
            field:
              type: textarea
              display: Heading
          -
            handle: subheading
            field:
              type: textarea
              display: Subheading
          -
            handle: lately
            field:
              type: checkboxes
              display: Lately
              instructions: 'Which kinds of Log entries to show on the homepage.'
              inline: true
              options:
                post: Writing
                tip: Tips
                make: Makes
                moment: Moments
          -
            handle: projects
            field:
              type: collections
              display: Projects
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
