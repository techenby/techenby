title: Home
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: heading
            field:
              type: textarea
              display: Heading
          -
            handle: subheading
            field:
              type: textarea
              display: Subheading
          -
            handle: lately
            field:
              type: collections
              display: Lately
          -
            handle: projects
            field:
              type: collections
              display: Projects
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
