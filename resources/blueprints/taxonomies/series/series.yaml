title: Series
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'A sentence or two about what the series covers.'
          -
            handle: up_next
            field:
              type: text
              display: 'Up next'
              instructions: 'Optional teaser for the next part, shown as "coming soon" in the series box. Leave empty once it''s published.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
