title: Log
route: '/log/{slug}'
template: '@blueprint'
propagate: true
taxonomies:
  - tags
  - series
date: true
sort_dir: desc
date_behavior:
  past: public
  future: private
preview_targets:
  -
    label: Entry
    url: '{permalink}'
    refresh: true
  -
    label: 'Social card'
    url: /social-card-preview
    refresh: true
